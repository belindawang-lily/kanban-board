<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>总看板 · 澎π计划AI训练营运营进度看板</title>
  <link rel="stylesheet" href="assets/css/kanban.css?v=10">
</head>
<body>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js?v=11"></script>
<script>
(function () {
  const view = K.mount('overview', {
    title: '总看板',
    crumb: '全局汇总 · 各队伍现状一览',
    tools: '<button class="btn btn-outline btn-sm" onclick="K.openFeishu()">' + K.icon('external', 15) + ' 飞书</button><button class="btn btn-gold btn-sm" onclick="location.href=\'quick-brief.html\'">' + K.icon('brief', 15) + ' 快报</button>'
  });

  const D = K.data;
  const teams = K.teams();
  const krs = D.keyResults || [];
  const reports = D.biweeklyReports || [];
  const checkins = D.checkins || [];
  const members = D.members || [];

  // 双周报期数
  const periodNum = (label) => { const m = /第(\d+)期/.exec(label || ''); return m ? +m[1] : 0; };
  const maxPeriod = reports.reduce((a, r) => Math.max(a, periodNum(r.period)), 0);
  const latestLabel = maxPeriod ? `第${maxPeriod}期` : '—';
  const submittedTeamIds = new Set(reports.filter(r => periodNum(r.period) === maxPeriod).map(r => r.teamId));
  const submitRate = teams.length ? Math.round(submittedTeamIds.size / teams.length * 100) : 0;

  const avgProgress = krs.length ? Math.round(krs.reduce((a, k) => a + k.progress, 0) / krs.length) : 0;
  const doingKRs = krs.filter(k => k.status === '进行中').length;
  const riskKRs = krs.filter(k => k.status === '有风险').length;
  const doneKRs = krs.filter(k => k.status === '已完成').length;
  const todoKRs = krs.filter(k => k.status === '未开始').length;

  const idStats = K.identityStats();

  // KR 状态分布（环形图数据）
  const statusColors = {
    '未开始': 'var(--c-todo)',
    '进行中': 'var(--c-doing)',
    '已完成': 'var(--c-done)',
    '有风险': 'var(--c-risk)'
  };
  const donutData = ['未开始', '进行中', '已完成', '有风险'].map(st => ({
    label: st,
    value: krs.filter(k => k.status === st).length,
    color: statusColors[st]
  }));

  // 双周报提交趋势（按期数）
  const periodSet = new Set(reports.map(r => periodNum(r.period)));
  const sortedPeriods = [...periodSet].sort((a, b) => a - b);
  const trendData = sortedPeriods.map(p => {
    const periodReports = reports.filter(r => periodNum(r.period) === p);
    const teamIds = new Set(periodReports.map(r => r.teamId));
    return {
      label: `第${p}期`,
      value: teams.length ? Math.round(teamIds.size / teams.length * 100) : 0,
      teamCount: teamIds.size
    };
  });

  let html = '';

  // ===== 分区一：核心指标 =====
  html += '<div class="section-title"><h2>核心指标</h2><span class="hint">训练营整体运营概览</span></div>';
  html += '<div class="stat-grid mb-4" style="grid-template-columns:repeat(6,1fr)">';
  html += K.statCard({ label: '队伍总数', value: teams.length, unit: '支', foot: '全部运转中' });
  html += K.statCard({ label: '成员总数', value: members.length, unit: '人', foot: '成员 ' + idStats[0].count + ' · 导师 ' + (idStats[2].count + idStats[3].count) });
  html += K.statCard({ label: 'OKR 平均进度', value: avgProgress, unit: '%', foot: doneKRs + ' 已完成 · ' + doingKRs + ' 进行中', variant: 'gold' });
  html += K.statCard({ label: '本期双周报', value: submittedTeamIds.size + '/' + teams.length, foot: latestLabel + ' · 提交率 ' + submitRate + '%', variant: 'gold' });
  html += K.statCard({ label: '打卡活动', value: checkins.length, unit: '次', foot: '覆盖 ' + new Set(checkins.flatMap(c => c.teamParticipantIds || [])).size + ' 人次', variant: 'gold' });
  html += K.statCard({ label: '有风险 KR', value: riskKRs, unit: '个', foot: riskKRs ? '需关注' : '暂无风险', variant: riskKRs ? 'risk' : 'done' });
  html += '</div>';

  // ===== 分区二：数据可视化 =====
  html += '<div class="section-title"><h2>数据洞察</h2><span class="hint">OKR 分布 · 打卡热力 · 提交趋势</span></div>';

  // Row 1: OKR 状态分布 + 双周报提交趋势 (side by side)
  html += '<div class="grid mb-4" style="grid-template-columns: 1fr 1fr">';

  // OKR 状态分布（环形图）
  html += '<div class="card card-pad"><div class="card-head" style="padding:0 0 12px;border:none"><h2>OKR 状态分布</h2><div class="head-spacer"></div><span class="text-muted text-sm">共 ' + krs.length + ' 个 KR</span></div>';
  html += K.donut(donutData, { centerVal: krs.length, centerLabel: 'KR 总数' });
  html += '</div>';

  // 双周报提交趋势
  html += '<div class="card card-pad"><div class="card-head" style="padding:0 0 12px;border:none"><h2>双周报提交趋势</h2><div class="head-spacer"></div><span class="text-muted text-sm">提交率 %</span></div>';
  if (trendData.length) {
    html += K.trendLine(trendData);
    html += '<div class="mt-3 text-sm" style="color:var(--muted-foreground)">最新一期 <strong style="color:var(--chart-5)">' + trendData[trendData.length-1].value + '%</strong>（' + trendData[trendData.length-1].teamCount + '/' + teams.length + ' 支队伍）</div>';
  } else {
    html += '<div class="text-muted text-sm" style="padding:20px;text-align:center">暂无趋势数据</div>';
  }
  html += '</div>';
  html += '</div>';

  // Row 2: 打卡活跃度热力图 (full width)
  html += '<div class="card card-pad mb-4"><div class="card-head" style="padding:0 0 12px;border:none"><h2>打卡活跃度热力图</h2><div class="head-spacer"></div><span class="text-muted text-sm">' + K.fmt.date(D.meta.cycleStart) + ' – ' + K.fmt.date(D.meta.cycleEnd) + '</span></div>';
  html += K.heatmap(checkins, {});
  html += '<div class="flex items-center gap-2 mt-3" style="font-size:10px;color:var(--muted-foreground)"><span>少</span>';
  html += '<div class="heatmap-cell" style="width:12px;height:12px;flex-shrink:0"></div>';
  html += '<div class="heatmap-cell l1" style="width:12px;height:12px;flex-shrink:0"></div>';
  html += '<div class="heatmap-cell l2" style="width:12px;height:12px;flex-shrink:0"></div>';
  html += '<div class="heatmap-cell l3" style="width:12px;height:12px;flex-shrink:0"></div>';
  html += '<div class="heatmap-cell l4" style="width:12px;height:12px;flex-shrink:0"></div>';
  html += '<span>多</span><span style="margin-left:16px"></span>';
  html += '<div class="heatmap-cell future" style="width:12px;height:12px;flex-shrink:0"></div>';
  html += '<span>未来</span></div>';
  html += '</div>';

  // ===== 分区三：队伍进度与活跃度 =====
  html += '<div class="section-title"><h2>队伍进度与活跃度</h2><span class="hint">点击队伍行查看 OKR 详情</span></div>';
  // 各队 OKR 进度表
  html += '<div class="card card-flush mb-4"><div class="card-head"><h2>各队 OKR 进度总览</h2><div class="head-spacer"></div><span class="text-muted text-sm">平均 ' + avgProgress + '% · 共 ' + krs.length + ' KR</span></div><div class="card-body"><div class="table-wrap"><table class="table"><thead><tr><th style="min-width:70px">队伍</th><th style="min-width:80px">队长</th><th class="text-right" style="min-width:40px">成员</th><th style="min-width:140px">OKR 进度</th><th class="text-right" style="min-width:36px">KR</th><th style="min-width:80px">最新双周报</th><th class="text-right" style="min-width:40px">打卡</th><th style="min-width:56px">状态</th></tr></thead><tbody>';
  teams.forEach(t => {
    const prog = K.teamProgress(t.id);
    const tkrs = K.krs(t.id);
    const rep = K.latestReport(t.id);
    const row = `location.href='okr.html?team=${t.id}'`;
    html += `<tr class="row-link" onclick="${row}">`;
    html += `<td class="cell-strong nowrap">${K.escape(t.name)}</td>`;
    html += `<td><div class="flex items-center gap-2 nowrap">${K.avatar(t.leader, 'sm')}<span class="text-sm">${K.escape(t.leader)}</span></div></td>`;
    html += `<td class="text-right tnum">${t.memberCount}</td>`;
    html += `<td>${K.progressHtml(prog, prog === 100 ? '已完成' : prog === 0 ? '未开始' : '进行中')}</td>`;
    html += `<td class="text-right tnum">${tkrs.length}</td>`;
    html += `<td class="cell-muted text-sm nowrap">${rep ? K.escape(rep.period) : '<span class="text-muted">未提交</span>'}</td>`;
    html += `<td class="text-right tnum">${K.checkinCount(t.id)}</td>`;
    html += `<td><span class="chip">${K.escape(t.status)}</span></td>`;
    html += '</tr>';
  });
  html += '</tbody></table></div></div></div>';

  // ===== 分区四：本期交付与参与 =====
  html += '<div class="section-title"><h2>本期交付与参与</h2><span class="hint">双周报提交情况 · 身份参与分布</span></div>';
  html += '<div class="grid grid-2">';
  // 双周报提交情况
  html += '<div class="card card-flush"><div class="card-head"><h2>本期双周报提交情况</h2><div class="head-spacer"></div><span class="chip chip-gold">' + K.escape(latestLabel) + '</span></div><div class="card-body">';
  html += '<div class="progress mb-3"><div class="pbar"><div class="pfill is-gold" style="width:'+submitRate+'%"></div></div><div class="pval">'+submitRate+'%</div></div>';
  html += '<div class="table-wrap"><table class="table"><thead><tr><th>队伍</th><th>本期</th><th>记录人</th><th>状态</th></tr></thead><tbody>';
  teams.forEach(t => {
    const rep = reports.filter(r => r.teamId === t.id && periodNum(r.period) === maxPeriod)[0];
    html += '<tr>';
    html += `<td class="cell-strong">${K.escape(t.name)}</td>`;
    html += `<td class="cell-muted text-sm">${rep ? K.escape(rep.period) : '—'}</td>`;
    html += `<td class="text-sm">${rep ? K.escape(rep.recorder) : '—'}</td>`;
    html += `<td>${rep ? K.statusChip('已完成') : '<span class="status status--todo"><span class="sdot"></span>未提交</span>'}</td>`;
    html += '</tr>';
  });
  html += '</tbody></table></div></div></div>';

  // 身份参与统计
  html += '<div class="card card-pad"><div class="card-head" style="padding:0 0 12px;border:none"><h2>身份参与统计</h2><div class="head-spacer"></div><span class="text-muted text-sm">按打卡参与人次</span></div>';
  html += '<div class="table-wrap"><table class="table"><thead><tr><th>身份</th><th class="text-right">人数</th><th class="text-right">参与人次</th><th style="min-width:100px">参与率</th></tr></thead><tbody>';
  idStats.forEach(x => {
    const rate = x.expected ? Math.round(x.participation / x.expected * 100) : 0;
    html += `<tr><td>${K.identityBadge(x.identity)}</td><td class="text-right tnum">${x.count}</td><td class="text-right tnum">${x.participation}/${x.expected}</td><td>${K.progressHtml(rate, '进行中')}</td></tr>`;
  });
  html += '</tbody></table>';
  html += '<div class="text-muted" style="font-size:10px;margin-top:6px">参与率 = 该身份实际参与人次 / 应参与人次（人数 × 场次数）</div>';
  html += '</div></div>';
  html += '</div>';

  view.innerHTML = html;
})();
</script>
</body>
</html>
